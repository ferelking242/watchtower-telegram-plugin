name: Build Telegram Source Plugin

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyrogram tgcrypto flake8 --quiet

      - name: Syntax check
        run: python3 -m py_compile script.py && echo "OK Syntax OK"

      - name: Validate manifest.json
        run: |
          python3 - <<'PYEOF'
          import json, sys
          with open('manifest.json') as f:
              m = json.load(f)
          required = ['id','name','version','author','runtime','ui','permissions','entry']
          missing = [k for k in required if k not in m]
          if missing:
              print('FAIL Champs manquants:', missing); sys.exit(1)
          print(f'OK manifest.json valide -- {m["id"]} v{m["version"]}')
          PYEOF

      - name: Lint
        run: flake8 script.py --max-line-length=120 --ignore=E501,W503 || true

      - name: Test help
        run: python3 script.py --help && echo "OK CLI help OK"

  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle Python deps (Android ARM64)
        run: |
          set -euo pipefail
          mkdir -p build/plugin

          # pyrogram — pure Python, works cross-platform
          echo ":: pyrogram..."
          pip install pyrogram \
            --target build/plugin/ \
            --platform manylinux2014_aarch64 \
            --only-binary :all: \
            --python-version 311 \
            --implementation cp \
            --no-cache-dir --quiet || \
          pip install pyrogram \
            --target build/plugin/ \
            --no-cache-dir --quiet

          # tgcrypto — C extension, ARM64 wheel from PyPI
          echo ":: tgcrypto..."
          pip install tgcrypto \
            --target build/plugin/ \
            --platform manylinux2014_aarch64 \
            --only-binary :all: \
            --python-version 311 \
            --implementation cp \
            --no-cache-dir --quiet || \
          pip install tgcrypto \
            --target build/plugin/ \
            --no-cache-dir --quiet

          # cryptg — optional accelerator
          echo ":: cryptg (optionnel)..."
          pip install cryptg \
            --target build/plugin/ \
            --platform manylinux2014_aarch64 \
            --only-binary :all: \
            --python-version 311 \
            --implementation cp \
            --no-cache-dir --quiet || true

          echo ":: Deps bundled:"
          ls build/plugin/

      - name: Assemble ZIP
        run: |
          set -euo pipefail
          PLUGIN_ID="com.watchtower.telegram-source"
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          ZIP_NAME="${PLUGIN_ID}_${PLUGIN_VERSION}.zip"

          cp script.py manifest.json build/plugin/
          [ -d ui  ] && cp -r ui  build/plugin/ || true
          [ -d res ] && cp -r res build/plugin/ || true

          mkdir -p dist
          (cd build/plugin && zip -r "../../dist/${ZIP_NAME}" . \
            -x "*.pyc" -x "*/__pycache__/*" -x "*.dist-info/*" -x "*.egg-info/*" -x "bin/*")

          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          SIZE=$(du -sh dist/${ZIP_NAME} | cut -f1)
          echo "OK ZIP: dist/${ZIP_NAME} (${SIZE})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-plugin-zip
          path: dist/*.zip
          retention-days: 30

  release-latest:
    name: Release (latest)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: telegram-plugin-zip
          path: dist/

      - name: Update latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Automatic build from main. Includes pyrogram + tgcrypto bundled for Android ARM64."
          files: dist/*.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-tag:
    name: Release (tag)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: telegram-plugin-zip
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
